<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本の通信簿 2026</title>
<meta name="description" content="世界ランキングと政府統計で日本を採点。学力は世界一なのに、英語96位・女性議員145位・生産性28位。Japan's Report Card 2026 / 日本成绩单 / 일본 성적표">
<meta property="og:title" content="日本の通信簿 2026 / Japan's Report Card 2026">
<meta property="og:description" content="学力は世界一。なのに英語96位、女性議員145位、生産性28位。公開データで日本を採点。">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 通知表の紙・藍インク・朱の評定印。左に評定欄、右に所見欄という通知表の組みを踏襲 */
  --paper:#f3f5f8;
  --sheet:#ffffff;
  --ink:#1b2a3f;
  --ink-soft:#526073;
  --rule:#d5dce4;
  --shu:#c8331f;
  --ai:#2c4f86;
  --good:#2f7d4f;
  --warn:#a8701a;
  --bad:#c8331f;
  --chip:#e8edf3;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK SC","Noto Serif KR",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans CJK SC","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151c;--sheet:#18202a;--ink:#e6ebf1;--ink-soft:#a6b1bf;--rule:#2d3845;
    --shu:#f07059;--ai:#93b6ee;--good:#5cc28a;--warn:#e2ab4f;--bad:#f07059;--chip:#232d39;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151c;--sheet:#18202a;--ink:#e6ebf1;--ink-soft:#a6b1bf;--rule:#2d3845;
  --shu:#f07059;--ai:#93b6ee;--good:#5cc28a;--warn:#e2ab4f;--bad:#f07059;--chip:#232d39;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.75;overflow-wrap:anywhere}
a{color:var(--ai)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--ai);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--rule)}
.brand{font-family:var(--font-display);font-weight:800;font-size:18px}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:3px 10px;border-radius:6px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
header.hero{padding:36px 0 28px;border-bottom:1px solid var(--rule)}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--ink-soft)}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5.4vw,50px);line-height:1.25;margin:8px 0 14px;text-wrap:balance}
h1 em{font-style:normal;color:var(--shu);white-space:nowrap}
:lang(ko) body,:lang(ko) h1,:lang(ko) h2,:lang(ko) h3,:lang(ko) p,:lang(ko) li,:lang(ko) td{word-break:keep-all}
h2{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3.4vw,30px);line-height:1.35;margin:0 0 8px;text-wrap:balance}
h3{font-size:17px;margin:0;line-height:1.45;text-wrap:balance}
.lead{max-width:68ch;color:var(--ink-soft);margin:0}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 0}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.tile .n{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--ink-soft)}
.tile.alert .n{color:var(--bad)}
.tile.ok .n{color:var(--good)}
.sharebar{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{font:inherit;font-size:14px;font-weight:700;background:var(--ai);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--sheet);color:var(--ink);border:1px solid var(--rule)}
:root[data-theme="dark"] .btn:not(.ghost){color:#10151c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#10151c}}
section{padding:36px 0;border-bottom:1px solid var(--rule)}
/* ねじれ */
.gaps{display:grid;gap:12px;margin-top:16px}
.gap{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.gap .side{padding:16px 18px}
.gap .side.l{background:color-mix(in srgb,var(--good) 9%,transparent)}
.gap .side.r{background:color-mix(in srgb,var(--bad) 9%,transparent);text-align:right}
.gap .big{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1.1;font-variant-numeric:tabular-nums}
.gap .side.l .big{color:var(--good)}
.gap .side.r .big{color:var(--bad)}
.gap .cap{font-size:14px;color:var(--ink-soft)}
.gap .vs{display:flex;align-items:center;padding:0 10px;font-weight:700;color:var(--ink-soft);font-size:14px}
@media (max-width:560px){.gap{grid-template-columns:1fr}.gap .side.r{text-align:left}.gap .vs{padding:4px 18px;justify-content:center}}
/* G7 */
.g7tbl{display:grid;gap:6px;margin-top:16px}
.g7row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 14px}
.dots{display:flex;gap:5px}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--chip);border:1px solid var(--rule)}
.dots span.jp{background:var(--shu);border-color:var(--shu)}
.dots span.jp.top{background:var(--good);border-color:var(--good)}
.g7pos{font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.g7pos.last{color:var(--bad)}
@media (max-width:520px){.g7row{grid-template-columns:1fr auto}.g7row .dots{grid-column:1 / -1}}
/* 通知表 */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.controls .lbl{font-size:13px;color:var(--ink-soft);margin-right:4px}
.fbtn{font:inherit;font-size:14px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
select{font:inherit;font-size:14px;padding:5px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink)}
.card{display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:12px}
.grade{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px dashed var(--rule);padding:12px 6px;gap:2px}
.stamp{width:58px;height:58px;border-radius:50%;border:3px solid var(--shu);color:var(--shu);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:30px;font-weight:800;transform:rotate(-6deg)}
.stamp.g4,.stamp.g5{border-color:var(--good);color:var(--good)}
.stamp.g3{border-color:var(--warn);color:var(--warn)}
.grade small{font-size:11px;color:var(--ink-soft)}
.body{padding:14px 18px;display:grid;gap:8px;min-width:0}
.row1{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.cat{font-size:12px;background:var(--chip);border-radius:999px;padding:1px 10px;color:var(--ink-soft)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;color:var(--bad);border:1px solid var(--bad)}
.badge.g{color:var(--good);border-color:var(--good)}
.fig{font-variant-numeric:tabular-nums;font-size:15px}
.fig b{font-family:var(--font-display);font-size:24px}
.trend{font-size:13px;font-weight:700;padding:1px 8px;border-radius:6px;white-space:nowrap}
.trend.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.trend.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.trend.flat{color:var(--ink-soft);background:var(--chip)}
.bar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--good) 40%,transparent),color-mix(in srgb,var(--warn) 35%,transparent),color-mix(in srgb,var(--bad) 40%,transparent))}
.bar i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink)}
.barlbl{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-soft);margin-top:2px}
.note{font-size:13px;color:var(--ink-soft)}
.shoken,.rx{font-size:14.5px;margin:0}
.shoken .k{font-weight:700;color:var(--shu)}
.rx{padding:8px 12px;border-left:3px solid var(--ai);background:color-mix(in srgb,var(--ai) 7%,transparent);border-radius:0 6px 6px 0}
.rx .k{font-weight:700;color:var(--ai)}
.foot{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center}
.src{font-size:12.5px;color:var(--ink-soft)}
.xshare{font-size:12.5px;font-weight:700;white-space:nowrap}
.empty{color:var(--ink-soft);font-size:14px}
/* 推移 */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px;margin-top:16px}
.chart{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 14px 8px;min-width:0}
.chart svg{width:100%;height:auto;display:block;color:var(--ink-soft)}
.chart .cn{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0}
/* 国内 */
.tblwrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14.5px}
th,td{padding:10px 14px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--ink-soft);font-weight:500;background:var(--chip)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
tr:last-child td{border-bottom:none}
/* レバー */
.levers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.lever{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px}
.lever .who{font-size:12px;color:var(--shu);font-weight:700;letter-spacing:.06em}
.lever ul{margin:8px 0 0;padding-left:1.2em;font-size:14.5px}
.copybox{display:grid;gap:8px;margin-top:20px}
textarea{font:inherit;font-size:14px;width:100%;min-height:130px;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);resize:vertical}
ol.sources{font-size:13px;padding-left:1.4em;color:var(--ink-soft)}
ol.sources li{margin-bottom:4px}
footer{padding:28px 0 48px;font-size:13px;color:var(--ink-soft)}
@media (max-width:520px){
  .wrap{padding:0 16px}
  .card{grid-template-columns:minmax(0,1fr)}
  .grade{flex-direction:row;justify-content:flex-start;gap:10px;border-right:none;border-bottom:1px dashed var(--rule);padding:10px 12px}
  .stamp{width:42px;height:42px;font-size:22px}
  .tile .n{font-size:28px}
  .body{padding:12px}
  .fig b{font-size:20px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
const LANGS=["ja","en","zh","ko"];

/* ---------- UI文言 ---------- */
const T={
 brand:{ja:"日本の通信簿 2026",en:"Japan's Report Card 2026",zh:"日本成绩单 2026",ko:"일본 성적표 2026"},
 eyebrow:{ja:"公開データで見る国際比較 ／ 2026年11月23日時点の最新版",en:"International comparison from public data / latest editions as of 23 Nov 2026",zh:"基于公开数据的国际比较 ／ 截至2026年11月23日的最新版本",ko:"공개 데이터로 본 국제 비교 / 2026년 11월 23일 기준 최신판"},
 headline:{ja:"学力は<em>世界一</em>。なのに、英語<em>96位</em>、女性議員<em>145位</em>、生産性<em>28位</em>。",en:"<em>No. 1</em> in school math. Yet <em>96th</em> in English, <em>145th</em> for women in parliament, <em>28th</em> in productivity.",zh:"学力<em>世界第一</em>。然而英语<em>第96</em>、女性议员<em>第145</em>、生产率<em>第28</em>。",ko:"학력은 <em>세계 1위</em>. 그런데 영어 <em>96위</em>, 여성 의원 <em>145위</em>, 생산성 <em>28위</em>."},
 lead:{ja:"世界ランキングと政府統計を、学校の通知表の形に並べ直しました。評定は「世界の上から何割の位置にいるか」で機械的に決めています。苦手科目と、すでに手本を示している国が一目でわかります。",en:"We turned global rankings and government statistics into a school report card. Each grade is set mechanically by where Japan sits in the world ranking, so weak subjects, and the countries already showing a better way, are visible at a glance.",zh:"我们把世界排名和政府统计整理成学校成绩单的形式。评分按日本在世界排名中所处的位置机械地给出，一眼就能看出弱项科目和已经做出示范的国家。",ko:"세계 순위와 정부 통계를 학교 성적표 형식으로 다시 정리했습니다. 평정은 '세계에서 상위 몇 % 위치인가'로 기계적으로 매겼습니다. 약한 과목과 이미 본보기를 보여주는 나라가 한눈에 보입니다."},
 shareX:{ja:"Xでシェア",en:"Share on X",zh:"分享到X",ko:"X에 공유"},
 jumpReport:{ja:"通知表を見る",en:"See the report card",zh:"查看成绩单",ko:"성적표 보기"},
 tAvg:{ja:"14科目の評定平均（5段階）",en:"Average grade across 14 subjects (out of 5)",zh:"14科平均评分（5分制）",ko:"14개 과목 평정 평균(5단계)"},
 tWeak:{ja:"評定1〜2の苦手科目",en:"Weak subjects (grade 1–2)",zh:"弱项科目（1–2分）",ko:"약한 과목(평정 1~2)"},
 tStrong:{ja:"評定4〜5の得意科目",en:"Strong subjects (grade 4–5)",zh:"强项科目（4–5分）",ko:"강한 과목(평정 4~5)"},

 methodText:{ja:"評定は、順位を「上から何%の位置か」（(順位−1)÷(対象数−1)）に直し、上位10%以内=5、30%以内=4、60%以内=3、85%以内=2、それより下=1としました。対象国の数や顔ぶれは指標ごとに違うため、評定は同じ物差しで並べるための目安です。政府債務は「重い方から2位」なので向きを逆にしています。IMDのデジタル・AIランキングは2026年に評価方法が変わり、前年順位は新方法で再計算された値です。数値はすべて下記の公表元か、その内容を報じた記事で確認しました。",en:"Each rank is converted to a percentile, (rank − 1) ÷ (number ranked − 1). Top 10% = 5, top 30% = 4, top 60% = 3, top 85% = 2, below that = 1. Country coverage differs by index, so grades are a rough common yardstick. Government debt is ranked from the heaviest, so its direction is reversed. IMD changed its digital/AI method in 2026; the prior-year rank is IMD's recalculation under the new method. Every figure was checked against the publisher below or a news report of it.",zh:"把名次换算为百分位（(名次−1)÷(参评数−1)）：前10%=5，前30%=4，前60%=3，前85%=2，其余=1。各指标参评国家数量和构成不同，评分只是统一尺度的参考。政府债务按\"从重到轻第2\"排序，因此方向取反。IMD数字与AI排名于2026年更改方法，上年名次为按新方法重算的数值。所有数字均已对照下列发布机构或相关报道核实。",ko:"순위를 '상위 몇 % 위치'((순위−1)÷(대상 수−1))로 바꿔 상위 10% 이내=5, 30% 이내=4, 60% 이내=3, 85% 이내=2, 그 아래=1로 매겼습니다. 지표마다 대상국 수와 구성이 달라 평정은 같은 잣대로 비교하기 위한 기준입니다. 정부 부채는 '무거운 쪽에서 2위'라 방향을 반대로 했습니다. IMD 디지털·AI 순위는 2026년 평가 방법이 바뀌어 전년 순위는 새 방법으로 재산출한 값입니다. 모든 수치는 아래 발표처나 그 내용을 보도한 기사로 확인했습니다."},

let lang="ja", cat="all", sortKey="grade";
function L(o){ if(o==null) return ""; if(typeof o==="string") return o; return o[lang]!=null?o[lang]:o.ja; }
function fmt(s,v){ return s.replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m); }
function ord(n){ const s=["th","st","nd","rd"],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function pct(it){ let p=(it.rank-1)/(it.total-1); if(it.heavy) p=1-p; return p; }
function grade(p){ if(p<=0.10)return 5; if(p<=0.30)return 4; if(p<=0.60)return 3; if(p<=0.85)return 2; return 1; }
ITEMS.forEach(it=>{ it.p=pct(it); it.g=grade(it.p); it.d=it.prev==null?0:it.prev-it.rank; });

function rankText(it){
  if(it.heavy) return {ja:"重い方から世界2位",en:"2nd heaviest in the world",zh:"世界第2重",ko:"세계에서 두 번째로 무거움"}[lang];
  return fmt(L(T.rankFmt),{n:it.rank,t:it.total,o:ord(it.rank)});
}
function trendInfo(it){
  if(it.prev==null) return {cls:"flat",txt:L(T.nocmp)};
  const v={d:Math.abs(it.d),p:it.prev,po:ord(it.prev)};
  if(it.d>0) return {cls:"up",txt:fmt(L(T.up),v)};
  if(it.d<0) return {cls:"down",txt:fmt(L(T.down),v)};
  return {cls:"flat",txt:fmt(L(T.flat),v)};
}
function g7Text(pos){
  if(pos===7) return L(T.g7last);
  if(pos===1) return L(T.g7top);
  return fmt(L(T.g7of),{n:pos,o:ord(pos)});
}

  const weak=ITEMS.filter(i=>i.g<=2).length, strong=ITEMS.filter(i=>i.g>=4).length;
  const g7last=ITEMS.filter(i=>i.g7===7).length;
  const avg=(ITEMS.reduce((a,i)=>a+i.g,0)/ITEMS.length).toFixed(1);
  return {weak,strong,g7last,avg};
}

function applyStatic(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.dataset.i18n; el.innerHTML=L(T[k]); });
  document.documentElement.lang = lang==="zh"?"zh-CN":lang;
  document.title=L(T.brand);
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
}
function renderSummary(){
  const s=stats(), u=L(T.unitSubj);
  document.getElementById("summary").innerHTML=
    '<div class="tile"><div class="n">'+s.avg+'</div><div class="l">'+esc(L(T.tAvg))+'</div></div>'+
    '<div class="tile alert"><div class="n">'+s.weak+(u?'<small style="font-size:16px">'+u+'</small>':'')+'</div><div class="l">'+esc(L(T.tWeak))+'</div></div>'+
    '<div class="tile ok"><div class="n">'+s.strong+(u?'<small style="font-size:16px">'+u+'</small>':'')+'</div><div class="l">'+esc(L(T.tStrong))+'</div></div>'+
    '<div class="tile alert"><div class="n">'+s.g7last+(u?'<small style="font-size:16px">'+u+'</small>':'')+'</div><div class="l">'+esc(L(T.tG7))+'</div></div>';
  const heroText=fmt(L(T.shareHero),{g7:s.g7last});
  document.getElementById("xHero").href=xUrl(heroText);
}
function renderGaps(){
  const side=(o,cls)=>{
    const big = typeof o.big==="string"? o.big : L(o.big);
    return '<div class="side '+cls+'"><div class="big">'+esc(L(o.pre))+esc(big)+'<span style="font-size:.5em">'+esc(L(o.unit))+'</span></div><div class="cap">'+esc(L(o.cap))+'</div></div>';
  };
  document.getElementById("gapList").innerHTML=GAPS.map(g=>'<div class="gap">'+side(g.l,"l")+'<div class="vs">'+esc(L(T.vs))+'</div>'+side(g.r,"r")+'</div>').join("");
}
function renderG7(){
  const list=ITEMS.filter(i=>i.g7!=null).sort((a,b)=>b.g7-a.g7);
  document.getElementById("g7List").innerHTML=list.map(it=>{
    let dots=""; for(let k=1;k<=7;k++){ dots+='<span class="'+(k===it.g7?'jp'+(it.g7===1?' top':''):'')+'"></span>'; }
    return '<div class="g7row"><a href="#'+it.id+'">'+esc(L(it.name))+'</a><div class="dots" role="img" aria-label="'+esc(g7Text(it.g7))+'">'+dots+'</div><div class="g7pos'+(it.g7===7?' last':'')+'">'+esc(g7Text(it.g7))+'</div></div>';
  }).join("");
}
function renderCatBtns(){
  const all=[{id:"all",l:T.all}].concat(CATS);
  document.getElementById("catBtns").innerHTML=all.map(c=>'<button type="button" class="fbtn" data-cat="'+c.id+'" aria-pressed="'+(c.id===cat)+'">'+esc(L(c.l))+'</button>').join("");
  document.querySelectorAll(".fbtn").forEach(b=>b.addEventListener("click",()=>{ cat=b.dataset.cat; renderCatBtns(); renderCards(); }));
}
function renderCards(){
  let list=ITEMS.filter(it=>cat==="all"||it.cat===cat);
  if(sortKey==="grade") list.sort((a,b)=>a.g-b.g||b.p-a.p);
  if(sortKey==="gradeDesc") list.sort((a,b)=>b.g-a.g||a.p-b.p);
  if(sortKey==="trend") list.sort((a,b)=>a.d-b.d||a.g-b.g);
  const el=document.getElementById("cards");
  if(!list.length){ el.innerHTML='<p class="empty">'+esc(L(T.noItems))+'</p>'; return; }
  el.innerHTML=list.map(it=>{
    const tr=trendInfo(it), rt=rankText(it), catL=L(CATS.find(c=>c.id===it.cat).l);
    const badges=(it.g7===7?'<span class="badge">'+esc(L(T.g7last))+'</span>':'')+(it.g7===1?'<span class="badge g">'+esc(L(T.g7top))+'</span>':'');
    const share=fmt(L(T.shareItem),{name:L(it.name),rank:rt,g:it.g});
    return '<article class="card" id="'+it.id+'">'+
      '<div class="grade"><div class="stamp g'+it.g+'" aria-label="'+esc(L(T.grade))+' '+it.g+'">'+it.g+'</div><small>'+esc(L(T.grade))+'</small></div>'+
      '<div class="body">'+
        '<div class="row1"><h3>'+esc(L(it.name))+'</h3><div class="tags">'+badges+'<span class="cat">'+esc(catL)+'</span></div></div>'+
        '<div class="row1"><span class="fig"><b>'+esc(rt)+'</b>　'+esc(L(it.value))+'</span><span class="trend '+tr.cls+'">'+esc(tr.txt)+'</span></div>'+
        '<div><div class="bar" role="img" aria-label="'+Math.round(it.p*100)+'%"><i style="left:calc('+(it.p*100).toFixed(1)+'% - 2px)"></i></div>'+
        '<div class="barlbl"><span>'+esc(L(T.top))+'</span><span>'+esc(L(T.bottom))+'</span></div>'+
        '<div class="note">'+esc(L(it.note))+'</div></div>'+
        '<p class="shoken"><span class="k">'+esc(L(T.shoken))+'</span>　'+esc(L(it.shoken))+'</p>'+
        '<p class="rx"><span class="k">'+esc(L(T.rx))+'</span>　'+esc(L(it.rx))+'</p>'+
        '<div class="foot"><div class="src">'+esc(L(T.src))+'：'+srcLinks(it.src)+'</div><a class="xshare" href="'+esc(xUrl(share))+'" target="_blank" rel="noopener">'+esc(L(T.shareThis))+'</a></div>'+
      '</div></article>';
  }).join("");
}
function lineChart(c){
  const W=520,H=230,ml=44,mr=40,mt=16,mb=30;
  const xs=c.data.map(d=>d[0]), ys=c.data.map(d=>d[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0,y1,ticks;
  if(c.rank){ y0=1; y1=Math.ceil((Math.max(...ys)+5)/20)*20; const st=y1<=60?10:(y1<=100?20:30); ticks=[]; for(let v=0;v<=y1;v+=st) ticks.push(Math.max(1,v)); }
  else { y0=1.0; y1=1.6; ticks=[1.0,1.2,1.4,1.6]; }
  const X=v=>ml+(v-x0)/(x1-x0)*(W-ml-mr);
  const Y=v=> c.rank ? mt+(v-y0)/(y1-y0)*(H-mt-mb) : mt+(y1-v)/(y1-y0)*(H-mt-mb);
  let g='';
  ticks.forEach(t=>{ g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'" stroke="currentColor" stroke-opacity=".18"/>'+
    '<text x="'+(ml-6)+'" y="'+(Y(t)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="currentColor">'+(c.rank?t:t.toFixed(1))+'</text>'; });
  const xt=[x0,x1]; const mid=Math.round((x0+x1)/2/5)*5; if(mid>x0+3&&mid<x1-3) xt.splice(1,0,mid);
  xt.forEach(t=>{ g+='<text x="'+X(t).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="currentColor">'+t+'</text>'; });
  let path='';
  for(let i=1;i<c.data.length;i++){
    const a=c.data[i-1], b=c.data[i], dash=(b[0]-a[0])>3;
    path+='<line x1="'+X(a[0]).toFixed(1)+'" y1="'+Y(a[1]).toFixed(1)+'" x2="'+X(b[0]).toFixed(1)+'" y2="'+Y(b[1]).toFixed(1)+'" stroke="var(--shu)" stroke-width="2.4"'+(dash?' stroke-dasharray="4 4" stroke-opacity=".6"':'')+' stroke-linecap="round"/>';
  }
  let pts=''; c.data.forEach((d,i)=>{ const last=i===c.data.length-1; pts+='<circle cx="'+X(d[0]).toFixed(1)+'" cy="'+Y(d[1]).toFixed(1)+'" r="'+(last?5:2.6)+'" fill="'+(last?'var(--shu)':'var(--sheet)')+'" stroke="var(--shu)" stroke-width="1.6"/>'; });
  const ld=c.data[c.data.length-1];
  const lab=c.rank?(lang==="en"?ord(ld[1]):(lang==="zh"?"第"+ld[1]:ld[1]+(lang==="ko"?"위":"位"))):ld[1].toFixed(2);
  const ly=Y(ld[1])-10<14?Y(ld[1])+20:Y(ld[1])-10;
  pts+='<text x="'+(X(ld[0])).toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">'+esc(lab)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(L(c.title))+'">'+g+path+pts+'</svg>';
}
function renderCharts(){
  document.getElementById("charts").innerHTML=CHARTS.map(c=>'<figure class="chart" style="margin:0"><h3>'+esc(L(c.title))+'</h3>'+lineChart(c)+'<figcaption class="cn">'+esc(L(c.note))+'</figcaption><div class="src" style="margin-top:4px">'+esc(L(T.src))+'：'+srcLinks(c.src)+'</div></figure>').join("");
}
function renderDom(){
  document.getElementById("dom").innerHTML=DOM.map(d=>'<tr><td>'+esc(L(d.name))+'</td><td class="num">'+esc(d.val)+'</td><td><span class="trend '+d.cls+'">'+esc(L(d.chg))+'</span></td><td>'+esc(L(d.pt))+'</td><td class="src">'+srcLinks(d.src)+'</td></tr>').join("");
}
function renderLevers(){
  document.getElementById("leverList").innerHTML=LEVERS.map(v=>'<div class="lever"><div class="who">'+esc(L(v.who))+'</div><h3>'+esc(L(v.h))+'</h3><ul>'+v.li.map(x=>'<li>'+esc(L(x))+'</li>').join("")+'</ul></div>').join("");
  const s=stats();
  const lows=ITEMS.filter(i=>i.g<=2&&!i.heavy).sort((a,b)=>b.p-a.p).slice(0,4).map(i=>L(i.name).replace(/[（(].*?[）)]/g,"").trim()+" "+(lang==="en"?ord(i.rank):(lang==="zh"?"第"+i.rank:i.rank+(lang==="ko"?"위":"位"))));
  const txt=fmt(L(T.shareLong),{avg:s.avg,weak:s.weak,strong:s.strong,g7:s.g7last,lows:lows.join(lang==="en"?", ":"、")})+"\n"+L(T.hashtag);
  document.getElementById("share").value=txt;
  document.getElementById("xBottom").href=xUrl(fmt(L(T.shareHero),{g7:s.g7last}));
}
function renderSources(){
  document.getElementById("sources").innerHTML=Object.values(S).map(s=>'<li><a href="'+esc(s.u)+'">'+esc(s.n)+'</a></li>').join("");
}
function renderAll(){ applyStatic(); renderSummary(); renderGaps(); renderG7(); renderCatBtns(); renderCards(); renderCharts(); renderDom(); renderLevers(); renderSources(); }

function setLang(l,push){
  if(!LANGS.includes(l)) l="ja";
  lang=l;
  try{ localStorage.setItem("tsushinbo-lang",l); }catch(e){}
  if(push){ try{ history.replaceState(null,"","#"+l); }catch(e){ location.hash=l; } }
  renderAll();
}
function initialLang(){
  const h=(location.hash||"").slice(1);
  if(LANGS.includes(h)) return h;
  try{ const s=localStorage.getItem("tsushinbo-lang"); if(LANGS.includes(s)) return s; }catch(e){}
  const n=(navigator.language||"ja").slice(0,2).toLowerCase();
  return LANGS.includes(n)?n:"ja";
}

document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang,true)));
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(LANGS.includes(h)&&h!==lang) setLang(h,false); });
document.getElementById("sort").addEventListener("change",e=>{ sortKey=e.target.value; renderCards(); });
document.getElementById("copyBtn").addEventListener("click",async()=>{
  const msg=document.getElementById("copyMsg"), t=document.getElementById("share");
  try{ await navigator.clipboard.writeText(t.value); msg.textContent=L(T.copied); }
  catch(e){ t.focus(); t.select(); msg.textContent=L(T.copyFail); }
});

/* 自己診断：翻訳漏れ・出典切れを検出（テスト用） */
window.__selftest=function(){
  const errs=[];
  const chk=(o,path)=>{ if(o==null){errs.push(path+": missing");return;} if(typeof o==="string") return; LANGS.forEach(l=>{ if(o[l]==null||o[l]==="") errs.push(path+"."+l+": empty"); }); };
  Object.keys(T).forEach(k=>{ if(k==="unitSubj") return; chk(T[k],"T."+k); });
  CATS.forEach(c=>chk(c.l,"CAT."+c.id));
  ITEMS.forEach(it=>{ ["name","value","note","shoken","rx"].forEach(f=>chk(it[f],it.id+"."+f)); it.src.forEach(s=>{ if(!S[s]) errs.push(it.id+": unknown source "+s); }); if(!CATS.find(c=>c.id===it.cat)) errs.push(it.id+": bad cat"); });
  CHARTS.forEach(c=>{ chk(c.title,c.id+".title"); chk(c.note,c.id+".note"); c.src.forEach(s=>{ if(!S[s]) errs.push(c.id+": unknown source "+s); }); for(let i=1;i<c.data.length;i++){ if(c.data[i][0]<=c.data[i-1][0]) errs.push(c.id+": years not ascending"); } });
  DOM.forEach((d,i)=>{ ["name","chg","pt"].forEach(f=>chk(d[f],"DOM"+i+"."+f)); d.src.forEach(s=>{ if(!S[s]) errs.push("DOM"+i+": unknown source "+s); }); });
  LEVERS.forEach((v,i)=>{ chk(v.who,"LEV"+i+".who"); chk(v.h,"LEV"+i+".h"); v.li.forEach((x,j)=>chk(x,"LEV"+i+".li"+j)); });
  GAPS.forEach((g,i)=>{ ["l","r"].forEach(s=>{ chk(g[s].cap,"GAP"+i+s+".cap"); }); });
  ITEMS.forEach(it=>{ if(it.rank<1||it.rank>it.total) errs.push(it.id+": rank out of range"); if(it.g<1||it.g>5) errs.push(it.id+": bad grade"); });
  const used=new Set(); ITEMS.forEach(i=>i.src.forEach(s=>used.add(s))); CHARTS.forEach(c=>c.src.forEach(s=>used.add(s))); DOM.forEach(d=>d.src.forEach(s=>used.add(s)));
  Object.keys(S).forEach(k=>{ if(!used.has(k)) errs.push("source unused: "+k); });
  return errs;
};

setLang(initialLang(),false);
